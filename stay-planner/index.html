<style>
:root{
  --bg:#E6EEEC; --surface:#F6FAF9; --ink:#13303B; --muted:#56717C; --line:#C7D6D3;
  --sea:#2B7A8A; --seaFill:rgba(43,122,138,.16); --night:rgba(19,48,59,.07);
  --buoy:#E59E14; --buoyFill:rgba(229,158,20,.22);
  --go:#2E8656; --goBg:#D9EFE2; --maybe:#A86F05; --maybeBg:#F7E8C6; --no:#B13A2C; --noBg:#F5DCD8;
  --any:#3F4FA0; --anyBg:#E1E5F5;
  --chip:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1F26; --surface:#152D36; --ink:#E3EDEB; --muted:#94AEB5; --line:#28454F;
    --sea:#62B9C6; --seaFill:rgba(98,185,198,.18); --night:rgba(0,0,0,.25);
    --buoy:#F2B640; --buoyFill:rgba(242,182,64,.2);
    --go:#6CCB93; --goBg:#173A29; --maybe:#F2C25B; --maybeBg:#3A2F12; --no:#F08A7C; --noBg:#40201C;
    --any:#A9B4EC; --anyBg:#262E52;
    --chip:#1B3842; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1F26; --surface:#152D36; --ink:#E3EDEB; --muted:#94AEB5; --line:#28454F;

  --any:#A9B4EC; --anyBg:#262E52;
  --chip:#1B3842; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
h1,h2,h3{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;margin:0;}
a{color:var(--sea);}
button,input{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--buoy);outline-offset:2px;}

.sub{margin:8px 0 0;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;}
.link-btn{background:none;border:0;padding:0;color:var(--sea);font-weight:700;text-decoration:underline;cursor:pointer;}
.dates{display:none;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;padding:14px;background:var(--surface);border-radius:16px;}
.dates.open{display:grid;}
.field label{display:block;font-size:.9rem;font-weight:700;margin-bottom:4px;}
.field small{display:block;color:var(--muted);font-size:.8rem;}
.field input{width:100%;min-height:44px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);}
.err{grid-column:1/-1;color:var(--no);font-size:.9rem;margin:0;}

.pick{border:0;margin:14px 0 0;padding:0;min-width:0;}
.pick legend{font-weight:700;font-size:.9rem;padding:0;margin-bottom:6px;}
#picks{display:flex;flex-wrap:wrap;gap:6px;}
.tick{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 12px 4px 8px;border:1.5px solid var(--line);border-radius:999px;background:var(--chip);font-size:.88rem;cursor:pointer;}
.tick input{width:18px;height:18px;margin:0;accent-color:var(--sea);}
.tick .ic svg{width:18px;height:18px;display:block;color:var(--sea);}
.tick:has(input:not(:checked)){opacity:.6;}
.tick.tick-all{border-color:var(--sea);opacity:1!important;}
.overview{margin-top:18px;}
.overview h3{font-size:1.15rem;font-weight:700;margin-bottom:8px;}
.gscroll{overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:thin;}
.grid{border-collapse:separate;border-spacing:3px;font-size:.78rem;}
.grid th{font-weight:700;text-align:center;padding:2px 4px;white-space:nowrap;}
.grid th small{display:block;font-weight:400;color:var(--muted);}
.grid th.act-h{position:sticky;left:0;z-index:2;background:var(--bg);text-align:left;min-width:118px;max-width:130px;white-space:normal;line-height:1.2;padding:4px 6px 4px 0;}
.grid th.act-h .ic{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:4px;color:var(--sea);}
.grid th.act-h .ic svg{width:16px;height:16px;}
.grid td{min-width:62px;height:44px;border-radius:9px;text-align:center;line-height:1.15;padding:3px;cursor:pointer;font-weight:700;}
.grid td.go{background:var(--goBg);color:var(--go);}
.grid td.maybe{background:var(--maybeBg);color:var(--maybe);}
.grid td.no{background:var(--noBg);color:var(--no);opacity:.55;font-weight:400;}
.grid td.tbc{background:var(--night);color:var(--muted);font-weight:400;}
.grid th.sel{color:var(--sea);}
.gkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin:8px 0 0;}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:14px -16px 0;padding:8px 16px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.strip::-webkit-scrollbar{display:none;}
.day-btn{flex:0 0 auto;min-width:64px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:14px;padding:8px 10px 6px;text-align:center;cursor:pointer;}
.day-btn .dn{font-weight:700;font-size:.9rem;display:block;}
.day-btn .dd{font-size:.75rem;color:var(--muted);display:block;}
.day-btn .de{display:block;height:28px;margin:2px 0;color:var(--sea);}
.day-btn .de svg{width:26px;height:26px;}
.day-btn[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.day-btn[aria-selected="true"] .de{color:var(--buoy);}
.day-btn[aria-selected="true"] .dd{color:var(--bg);opacity:.75;}

.hero{margin:18px 0 0;border-radius:22px;overflow:hidden;line-height:0;box-shadow:0 1px 0 var(--line);}
.hero svg{width:100%;height:auto;display:block;}
.verdict{margin-top:18px;}
.verdict .kind{font-size:.9rem;color:var(--muted);font-weight:700;margin:0 0 2px;}
.verdict h2{font-size:2.4rem;font-weight:800;letter-spacing:-.025em;line-height:1;}
.verdict p{margin:10px 0 0;font-size:1.05rem;max-width:60ch;}
.conf{display:inline-block;margin-top:10px;font-size:.82rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;}

.conds{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:22px;padding:16px;background:var(--surface);border-radius:20px;}
.compass{width:96px;height:96px;}
.cond-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
.cond-list div b{display:block;font-size:1.15rem;font-family:"Bricolage Grotesque",system-ui,sans-serif;}
.cond-list div span{font-size:.8rem;color:var(--muted);}
.windnote{grid-column:1/-1;font-size:.92rem;padding:8px 12px;border-radius:12px;}

section h3{font-size:1.15rem;font-weight:700;margin-bottom:8px;}
.tide,.acts,.plan,.mine{margin-top:24px;}
.tide-svg{width:100%;height:auto;display:block;}
.tide-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:6px;}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;}
.small{margin:8px 0 0;font-size:.9rem;color:var(--muted);}

.act{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);}
.act:last-child{border-bottom:1px solid var(--line);}
.act .ic{width:28px;height:28px;color:var(--sea);}
.act .ic svg{width:28px;height:28px;}
.act .nm{font-weight:700;}
.act .why{grid-column:2/4;font-size:.9rem;color:var(--muted);}
.act .why a{font-weight:700;}
.pill{font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;}
.pill.go{color:var(--go);background:var(--goBg);}
.pill.maybe{color:var(--maybe);background:var(--maybeBg);}
.pill.no{color:var(--no);background:var(--noBg);}
.pill.any{color:var(--any);background:var(--anyBg);}
.pill.tbc{color:var(--muted);background:var(--night);}

.plan ol{list-style:none;margin:0;padding:0;}
.plan li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:6px 0;}
.plan li time{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;color:var(--sea);}

.slot{display:grid;grid-template-columns:100px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.slot:last-child{border-bottom:1px solid var(--line);}
.slot-name{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;color:var(--sea);padding-top:7px;}
.slot.off .slot-name,.slot.off .offtxt{color:var(--muted);opacity:.75;}
.offtxt{font-size:.9rem;padding-top:8px;}
.items{display:flex;flex-direction:column;gap:8px;}
.item{background:var(--surface);border-radius:12px;padding:9px 40px 9px 12px;position:relative;}
.item strong{display:block;line-height:1.3;}
.item p{margin:2px 0 0;font-size:.88rem;color:var(--muted);}
.item a{font-size:.88rem;font-weight:700;}
.rm{position:absolute;top:5px;right:5px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;}
.add{align-self:flex-start;min-height:38px;padding:5px 14px;border:1.5px dashed var(--sea);border-radius:10px;background:transparent;color:var(--sea);font-weight:700;cursor:pointer;}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.btn{min-height:40px;padding:6px 16px;border-radius:999px;border:1.5px solid var(--sea);background:transparent;color:var(--sea);font-weight:700;cursor:pointer;}
.btn.solid{background:var(--sea);color:var(--surface);}
.toast{min-height:1.2em;font-size:.88rem;color:var(--muted);margin:6px 0 0;}

.rules{margin-top:36px;padding:18px;border-radius:20px;border:2px solid var(--no);}
.rules ul{margin:0;padding-left:20px;}
.rules li{margin:6px 0;}
footer{margin-top:24px;font-size:.82rem;color:var(--muted);}

dialog{border:0;padding:0;width:min(640px,100%);max-width:100%;max-height:88vh;margin:auto auto 0;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink);}
dialog::backdrop{background:rgba(8,24,30,.5);}
@media (min-width:700px){dialog{margin:auto;border-radius:22px;}}
.sheet-head{position:sticky;top:0;background:var(--surface);padding:18px 16px 10px;border-bottom:1px solid var(--line);z-index:1;}
.sheet-head h3{font-size:1.3rem;padding-right:44px;margin:0;}
.close{position:absolute;top:12px;right:12px;width:40px;height:40px;border:0;border-radius:50%;background:var(--bg);font-size:22px;cursor:pointer;}
.ideas{list-style:none;margin:0;padding:4px 16px 12px;}
.idea button{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;cursor:pointer;}
.idea .ic{color:var(--sea);width:26px;height:26px;}
.idea .ic svg{width:26px;height:26px;}
.idea .nm{font-weight:700;}
.idea .why{grid-column:2/4;font-size:.86rem;color:var(--muted);}
.idea button:disabled{cursor:default;opacity:.55;}
.own{display:flex;gap:8px;padding:6px 16px 22px;}
.own input{flex:1;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);}

@media (prefers-reduced-motion: no-preference){
  #panel{transition:opacity .18s ease;}
  #panel.fading{opacity:.2;}
}
@media print{.strip,.tools,.add,.rm,.link-btn,dialog,.dates{display:none!important}body{background:#fff}}

<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo" role="img" aria-label="Moonfleet"></div><h1>Your stay</h1></div>
    <p class="sub"><span id="stayline"></span><button class="link-btn" id="edit" aria-expanded="false" aria-controls="dates">Change dates</button></p>
    <div class="dates" id="dates">
      <div class="field"><label for="arrive">Arriving</label><input id="arrive" type="date"><small>Check in from 16:00</small></div>
      <div class="field"><label for="depart">Leaving</label><input id="depart" type="date"><small>Check out by 10:00</small></div>
      <p class="err" id="err" hidden></p>
    </div>
  </header>

  <fieldset class="pick" id="pick"><legend>Show these activities</legend><div id="picks"></div></fieldset>
  <section class="overview" aria-labelledby="gridH">
    <h3 id="gridH">When each activity works</h3>
    <div class="gscroll"><table class="grid" id="grid"></table></div>
    <p class="gkey"><span><span class="sw" style="background:var(--goBg);border:1px solid var(--go)"></span>Go</span><span><span class="sw" style="background:var(--maybeBg);border:1px solid var(--maybe)"></span>Maybe</span><span><span class="sw" style="background:var(--noBg);border:1px solid var(--no)"></span>No</span><span>Times are the best window. Tap a day for details.</span></p>
  </section>
  <nav class="strip" role="tablist" aria-label="Choose a day" id="strip"></nav>
  <main id="panel" role="tabpanel" aria-live="polite"></main>


  <footer id="footer"></footer>
</div>

<dialog id="sheet" aria-labelledby="sheetT">
  <div class="sheet-head"><h3 id="sheetT">Add to your day</h3><button class="close" id="close" aria-label="Close">×</button></div>
  <ul class="ideas" id="ideas"></ul>
  <form class="own" id="own"><input id="ownTxt" maxlength="80" placeholder="Something else, e.g. lunch with friends" aria-label="Add your own plan"><button class="btn solid" type="submit">Add</button></form>
</dialog>

<script>
// ================= Place =================
const LAT=50.770, LON=-0.851;          // Moonfleet, West Bracklesham Drive
const SEA_LAT=50.74, SEA_LON=-0.86;    // just offshore, for waves and tides
const ARRIVE=16*60, LEAVE=10*60;
const KEY="moonfleet-stay-v2", CACHE="moonfleet-wx-v2";

// ================= Saved forecast (Sun 18 Oct 2026, Met Office / Surf-Forecast / Wisuki) =================
// Used only when the live forecast can't be reached.
const SNAP_TAKEN="Sunday 18 October";
const SNAP_TIDES=[
  ["2026-10-17","03:53","H",4.1],["2026-10-17","08:49","L",1.8],["2026-10-17","16:00","H",4.0],["2026-10-17","21:10","L",1.8],
  ["2026-10-18","05:00","H",3.9],["2026-10-18","09:30","L",2.1],["2026-10-18","17:13","H",3.8],["2026-10-18","21:58","L",2.1],
  ["2026-10-19","06:08","H",3.8],["2026-10-19","10:37","L",2.5],["2026-10-19","12:02","H",2.5],["2026-10-19","12:53","L",2.5],["2026-10-19","18:29","H",3.7],
  ["2026-10-20","01:06","L",2.3],["2026-10-20","07:17","H",3.8],["2026-10-20","13:43","L",2.4],["2026-10-20","19:41","H",3.7],
  ["2026-10-21","01:52","L",2.1],["2026-10-21","08:26","H",3.9],["2026-10-21","14:18","L",2.1],["2026-10-21","20:48","H",3.9],
  ["2026-10-22","02:30","L",1.8],["2026-10-22","09:23","H",4.1],["2026-10-22","14:52","L",1.8],["2026-10-22","21:39","H",4.1],
  ["2026-10-23","03:07","L",1.5],["2026-10-23","10:05","H",4.4],["2026-10-23","15:28","L",1.5],["2026-10-23","22:19","H",4.4],
  ["2026-10-24","03:44","L",1.2],["2026-10-24","10:39","H",4.6],["2026-10-24","16:05","L",1.2],["2026-10-24","22:54","H",4.6],
  ["2026-10-25","04:23","L",1.0]
];
const SNAP_DAYS={
 "2026-10-18":{wx:"bright",sky:"Sunny spells, showers later",t:14,dir:22,wind:16,gust:27,waves:.2,dry:[[450,960]],sun:["07:32","18:06"]},
 "2026-10-19":{wx:"clearing",sky:"Sunny spells",t:15,dir:90,wind:13,gust:20,waves:.3,dry:[[600,1020]],sun:["07:34","18:04"]},
 "2026-10-20":{wx:"drizzle",sky:"Light rain",t:14,dir:90,wind:9,gust:19,waves:.3,dry:[],sun:["07:35","18:01"]},
 "2026-10-21":{wx:"showers",sky:"Light rain, then showers",t:14,dir:270,wind:16,gust:25,waves:1.0,dry:[[450,600]],sun:["07:37","17:59"]},
 "2026-10-22":{wx:"clearing",sky:"Sunny spells",t:15,dir:247,wind:13,gust:22,waves:1.0,dry:[[480,960]],sun:["07:39","17:58"]},
 "2026-10-23":{wx:"storm",sky:"Heavy rain, then mixed",t:13,dir:270,wind:35,gust:54,waves:2.5,dry:[[660,1020]],sun:["07:40","17:56"]},
 "2026-10-24":{wx:"windy",sky:"Rain, brighter later",t:15,dir:270,wind:25,gust:43,waves:1.2,dry:[[780,1050]],sun:["07:42","17:54"]}
};
const SNAP_SEA=17;

// ================= Helpers =================
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const hm=m=>{m=Math.round(m);m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+":"+pad(m%60);};
const toMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m;};
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const fmtLong=s=>parse(s).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DIRN=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const dirName=deg=>DIRN[Math.round(((deg%360)+360)%360/22.5)%16];
const DIRWORD={N:"northerly",NNE:"north-north-easterly",NE:"north-easterly",ENE:"east-north-easterly",E:"easterly",ESE:"east-south-easterly",SE:"south-easterly",SSE:"south-south-easterly",S:"southerly",SSW:"south-south-westerly",SW:"south-westerly",WSW:"west-south-westerly",W:"westerly",WNW:"west-north-westerly",NW:"north-westerly",NNW:"north-north-westerly"};
// Bracklesham faces roughly south: winds from the north and east blow out to sea
function windState(deg){deg=((deg%360)+360)%360;if(deg>=315||deg<=75)return"offshore";if(deg<=125||deg>=280)return"cross";return"onshore";}

function ukOffset(dateStr){ // minutes ahead of UTC at local noon
  const [y,m,d]=dateStr.split("-").map(Number);
  const h=Number(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",hour:"numeric",hourCycle:"h23"}).format(new Date(Date.UTC(y,m-1,d,12))));
  return (h-12)*60;
}
function sunTimes(dateStr){ // NOAA approximation, good to a minute or two
  const d=parse(dateStr),start=new Date(d.getFullYear(),0,1),N=Math.round((d-start)/864e5)+1;
  const g=2*Math.PI/365*(N-1);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const la=LAT*Math.PI/180;
  const ha=Math.acos(Math.cos(90.833*Math.PI/180)/(Math.cos(la)*Math.cos(dec))-Math.tan(la)*Math.tan(dec))*180/Math.PI;
  const off=ukOffset(dateStr);
  return [720-4*(LON+ha)-eq+off,720-4*(LON-ha)-eq+off];
}

// ================= State =================
let state={arrive:"",depart:"",plan:{},sel:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s==="object")state=Object.assign(state,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
if(!state.arrive||!state.depart){const t=iso(new Date());state.arrive=t;state.depart=addDays(t,6);}

let LIVE=null; // {fetched, wx, sea}

// ================= Forecast loading =================
const WX_URL=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=precipitation,precipitation_probability,wind_speed_10m,wind_gusts_10m&daily=weather_code,temperature_2m_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant,sunrise,sunset&wind_speed_unit=mph&timezone=Europe%2FLondon&forecast_days=16`;
const SEA_URL=`https://marine-api.open-meteo.com/v1/marine?latitude=${SEA_LAT}&longitude=${SEA_LON}&hourly=sea_level_height_msl,sea_surface_temperature&daily=wave_height_max&timezone=Europe%2FLondon&forecast_days=16`;
async function loadLive(){
  try{const c=JSON.parse(localStorage.getItem(CACHE)||"null");if(c&&Date.now()-c.fetched<60*60*1000){LIVE=c;return;}}catch(e){}
  try{
    const [w,s]=await Promise.all([fetch(WX_URL).then(r=>{if(!r.ok)throw 0;return r.json();}),fetch(SEA_URL).then(r=>r.ok?r.json():null).catch(()=>null)]);
    if(!w||!w.daily)throw 0;
    LIVE={fetched:Date.now(),wx:w,sea:s};
    try{localStorage.setItem(CACHE,JSON.stringify(LIVE));}catch(e){}
  }catch(e){
    try{const c=JSON.parse(localStorage.getItem(CACHE)||"null");if(c)LIVE=c;}catch(e2){}
  }
}

const CODE=c=>c<=1?["bright","Sunny"]:c===2?["clearing","Sunny spells"]:c===3?["cloudy","Cloudy"]:c<=48?["fog","Fog"]:c<=57?["drizzle","Drizzle"]:c<=65?["rain","Rain"]:c<=67?["rain","Freezing rain"]:c<=77?["snow","Snow"]:c<=82?["showers","Showers"]:c<=86?["snow","Snow showers"]:["storm","Thunderstorms"];

function liveTides(dateStr){
  const s=LIVE&&LIVE.sea; if(!s||!s.hourly||!s.hourly.sea_level_height_msl)return null;
  const T=s.hourly.time,H=s.hourly.sea_level_height_msl,base=parse(dateStr).getTime();
  const pts=[];T.forEach((t,i)=>{if(H[i]==null)return;const [ds,ts]=t.split("T");const m=(parse(ds).getTime()-base)/6e4+toMin(ts);if(m>=-900&&m<=2340)pts.push({m,h:H[i]});});
  if(pts.length<24)return null;
  const ex=[];
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1].h,b=pts[i].h,c=pts[i+1].h;
    if((b>a&&b>=c)||(b<a&&b<=c)){
      const den=a-2*b+c, off=den?0.5*(a-c)/den:0;
      ex.push({m:pts[i].m+off*60,h:+(b-0.25*(a-c)*off).toFixed(2),k:b>a?"H":"L"});
    }
  }
  const inDay=ex.filter(e=>e.m>=-60&&e.m<=1500);
  return ex.length>=3?{ex,inDay,rel:true}:null;
}
function snapTides(dateStr){
  const base=parse(dateStr).getTime();
  const ex=SNAP_TIDES.map(([d,t,k,h])=>({m:(parse(d).getTime()-base)/6e4+toMin(t),h,k}));
  if(!ex.some(e=>e.m>=0&&e.m<1440))return null;
  return {ex,inDay:ex.filter(e=>e.m>=-60&&e.m<=1500),rel:false};
}
function tideAt(td,m){
  const ex=td.ex;for(let i=0;i<ex.length-1;i++){const a=ex[i],b=ex[i+1];if(m>=a.m&&m<=b.m){const f=(m-a.m)/(b.m-a.m);return a.h+(b.h-a.h)*(1-Math.cos(Math.PI*f))/2;}}
  return null;
}

function buildDay(dateStr,idx,total){
  const first=idx===0,last=idx===total-1;
  const d={date:dateStr,idx,first,last,wd:parse(dateStr).getDay(),avail:[first?ARRIVE:0,last?LEAVE:1440]};
  const sunC=sunTimes(dateStr);
  // live
  const w=LIVE&&LIVE.wx, di=w?w.daily.time.indexOf(dateStr):-1;
  if(di>=0&&w.daily.weather_code[di]!=null){
    const [wx,sky]=CODE(w.daily.weather_code[di]);
    const hrs=[];w.hourly.time.forEach((t,i)=>{if(t.startsWith(dateStr))hrs.push({m:toMin(t.split("T")[1]),p:w.hourly.precipitation[i],pp:w.hourly.precipitation_probability?w.hourly.precipitation_probability[i]:null,ws:w.hourly.wind_speed_10m[i],wg:w.hourly.wind_gusts_10m[i]});});
    const dry=[];let cur=null;
    hrs.forEach(h=>{const ok=(h.p==null||h.p<0.2)&&(h.pp==null||h.pp<45);if(ok){if(!cur){cur=[h.m,h.m+60];dry.push(cur);}else cur[1]=h.m+60;}else cur=null;});
    const day=hrs.filter(h=>h.m>=9*60&&h.m<=17*60&&h.ws!=null);
    const avg=day.length?day.reduce((s,h)=>s+h.ws,0)/day.length:w.daily.wind_speed_10m_max[di];
    const gmax=day.length?Math.max(...day.map(h=>h.wg||0)):w.daily.wind_gusts_10m_max[di];
    let sst=null;const s=LIVE.sea;
    if(s&&s.hourly&&s.hourly.sea_surface_temperature){const v=[];s.hourly.time.forEach((t,i)=>{if(t.startsWith(dateStr)&&s.hourly.sea_surface_temperature[i]!=null)v.push(s.hourly.sea_surface_temperature[i]);});if(v.length)sst=v.reduce((a,b)=>a+b,0)/v.length;}
    let waves=null;if(s&&s.daily){const j=s.daily.time.indexOf(dateStr);if(j>=0)waves=s.daily.wave_height_max[j];}
    const sr=w.daily.sunrise[di],ss=w.daily.sunset[di];
    Object.assign(d,{src:"live",wx:gmax>=45&&wx!=="storm"?"windy":wx,sky,t:Math.round(w.daily.temperature_2m_max[di]),dir:w.daily.wind_direction_10m_dominant[di]??225,wind:Math.round(avg),gust:Math.round(gmax),waves,sea:sst,dry,
      sun:[sr?toMin(sr.split("T")[1]):sunC[0],ss?toMin(ss.split("T")[1]):sunC[1]],tide:liveTides(dateStr)});
    if(gmax>=50)d.wx="storm";
  }else if(!LIVE&&SNAP_DAYS[dateStr]){
    const s=SNAP_DAYS[dateStr];
    Object.assign(d,{src:"snap",wx:s.wx,sky:s.sky,t:s.t,dir:s.dir,wind:s.wind,gust:s.gust,waves:s.waves,sea:SNAP_SEA,dry:s.dry,sun:s.sun.map(toMin),tide:snapTides(dateStr)});
  }else{
    Object.assign(d,{src:"none",wx:"cloudy",sky:"",dir:225,wind:null,gust:null,waves:null,sea:null,dry:null,sun:sunC,tide:snapTides(dateStr)&&!LIVE?snapTides(dateStr):liveTides(dateStr)});
  }
  d.state=windState(d.dir);
  // usable daylight within the stay
  d.useA=Math.max(d.avail[0],d.sun[0]);d.useB=Math.min(d.avail[1],d.sun[1]);
  d.dryUse=d.dry?d.dry.reduce((s,[a,b])=>s+Math.max(0,Math.min(b,d.useB)-Math.max(a,d.useA)),0):null;
  d.lows=d.tide?d.tide.inDay.filter(e=>e.k==="L"&&e.m>=d.useA+30&&e.m<=d.useB-60):[];
  return d;
}

// ================= Icons =================
const I=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON={
  bike:I(`<circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-7h5l3 7M10 9l3 7H6M15 9l-1-3h-2M8.5 7h3"/>`),
  sup:I(`<path d="M2.5 19.5c6 1.5 13 1.5 19 0"/><circle cx="12" cy="4.5" r="1.6"/><path d="M12 6.5v6.5l-2 5M12 13l2 5M12 9l3.5-1.5"/><path d="M17 2.5L13 21"/>`),
  body:I(`<rect x="7" y="3" width="9" height="12" rx="3.5" transform="rotate(18 11.5 9)"/><path d="M10 6.5l2.5.8"/><path d="M2 19c2.5-2.5 4.5-2.5 7 0s4.5 2.5 7 0 4.5-2.5 6 0"/>`),
  swim:I(`<circle cx="16" cy="6" r="2"/><path d="M4 12l5-3 3 3 3-2"/><path d="M2 17c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 21c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0"/>`),
  fossil:I(`<path d="M12 21c-5 0-8-3.5-8-8a8 8 0 0 1 16 0c0 4.5-3 8-8 8z"/><path d="M12 21V8M12 21l-5-9M12 21l5-9M12 21L4.5 15M12 21l7.5-6"/>`),
  kayak:I(`<path d="M2 15c5 2.5 15 2.5 20 0"/><path d="M4 21L20 9"/><path d="M18.5 7.5l3 1-1 3M5.5 22.5l-3-1 1-3"/><circle cx="12" cy="9" r="1.6"/>`),
  crab:I(`<ellipse cx="12" cy="14" rx="5" ry="3.5"/><path d="M7 14H3M17 14h4M8 17l-3 3M16 17l3 3M8 11L5 6l3 1M16 11l3-5-3 1"/>`),
  bird:I(`<path d="M3 12c3-4 6-4 9 0 3-4 6-4 9 0"/><path d="M8 18c1.5-2 3-2 4 0 1-2 2.5-2 4 0"/>`),

const ACT=id=>ACTS.find(a=>a.id===id);
const on=a=>!(state.off||[]).includes(a.id);
function dryText(d){
  if(!d.dry)return"";
  const segs=d.dry.map(([a,b])=>[Math.max(a,d.useA),Math.min(b,d.useB)]).filter(([a,b])=>b-a>=60);
  if(!segs.length)return"none in daylight";
  const best=segs.sort((x,y)=>(y[1]-y[0])-(x[1]-x[0]))[0];return`${hm(best[0])}–${hm(best[1])}`;
}

// ================= Verdict and plan =================
function analyse(d){
  const rated=ACTS.filter(on).map(a=>({a,r:a.rate(d)}));
  const outs=rated.filter(x=>x.a.out);
  const rank={go:2,maybe:1};
  const pref=["sup","body","kite","swim","kayak","bike","westwitt","walk","crab","fossils"];
  const best=outs.filter(x=>x.r[0]==="go").sort((x,y)=>pref.indexOf(x.a.id)-pref.indexOf(y.a.id));
  const maybes=outs.filter(x=>x.r[0]==="maybe").sort((x,y)=>pref.indexOf(x.a.id)-pref.indexOf(y.a.id));
  let title,fig="",kind=d.first?"Arrival day":d.last?"Leaving day":"";
  const rainP=d.dryUse==null?"":d.dryUse>=d.useB-d.useA-30?"Dry through the day":d.dryUse<60?"Wet for most of the day":`Driest ${dryText(d)}`;
  const wind=d.wind!=null?`${DIRWORD[dirName(d.dir)]} ${d.wind}mph, gusting ${d.gust}mph`:"";
  let summary="";
  if(d.src==="none"){title=d.first?"Arrival evening":d.last?"Last morning":"Forecast to come";summary="The forecast for this day appears about a week to ten days before. Here’s what’s on regardless.";}
  else if(d.wx==="storm"||d.gust>=48){title="Storm day";summary=`${d.sky}. Gusts up to ${d.gust}mph${d.waves!=null?` and waves to ${d.waves.toFixed(1)}m`:""}. Stay off the beach today.`;}
  else if(d.first){title=d.dryUse>=45?"Arrival and a sunset stroll":"Arrival evening";summary=`${d.sky}, ${d.t}°C, ${wind}. Sunset ${hm(d.sun[1])}.`;}
  else if(d.last){title="Leaving morning";summary=`${d.sky}, ${wind}. Check out by 10:00.`;}
  else{
    const top=best[0]||null;
    const T={sup:"Paddleboard day",body:"Bodyboards and beach",kite:"Kitesurf day",swim:"Beach and a swim",kayak:"Kayaks at Dell Quay",bike:"Dry day for bikes",westwitt:"West Wittering day",walk:"Big skies walk",crab:"Crabbing day",fossils:"Fossil hunting at low tide"};
    if(top){title=T[top.a.id];fig={sup:"sup",body:"body",swim:"swim",bike:"bike",kite:"kite"}[top.a.id]||"";}
    else if(maybes.length&&d.dryUse>=90)title=d.gust>=30?"Blowy beach walk":"Mixed day, pick your moment";
    else title="Not a beach day";
    summary=`${d.sky}, ${d.t}°C, ${wind}. ${rainP}.`;
  }
  return {rated,best,maybes,title,summary,kind,fig,plan:planFor(d,best,maybes)};
}
function planFor(d,best,maybes){
  const P=[],W=[];const q=m=>Math.round(m/15)*15;const add=(m,txt,win)=>{P.push([q(m),txt]);if(win)W.push([q(win[0]),win[1]]);};
  const open=d.wd>=2&&d.wd<=6;
  if(d.first){
    add(ARRIVE,"Arrive and settle in");
    if(d.src!=="none"&&d.dryUse>=40){add(ARRIVE+30,`Walk to the beach at the end of the road for sunset (${hm(d.sun[1])})`,[ARRIVE+30,d.sun[1]]);}
  }else if(d.last){
    add(8*60,"Pack up");
    if(d.src!=="none"&&d.dry&&d.dry.some(([a,b])=>a<=8*60+15&&b>=9*60)&&d.sun[0]<8*60+15&&d.wx!=="storm")add(8*60+30,"Last walk on the beach",[8*60+30,9*60+15]);
    add(9*60+40,"Keys in the keybox, back gate left unbolted");
    add(LEAVE,"Check out");
  }else{
    let segs=(d.dry||[]).map(([a,b])=>[Math.max(a,d.useA,9*60),Math.min(b,d.useB)]).filter(([a,b])=>b-a>=90);
    if(d.src==="none")segs=[];
    const taken=[];
    const fos=best.concat(maybes).find(x=>x.a.id==="fossils");
    if(fos&&d.lows.length&&fos.r[0]!=="no"){const l=d.lows[0].m;const s=Math.max(d.useA,l-60),e=Math.min(d.useB,l+60);add(s,`Fossil hunting around low tide (${hm(l)})${fos.r[0]==="maybe"?", if it’s dry":""}`,[s,e]);taken.push([s,e]);}
    const picks=best.filter(x=>x.a.id!=="fossils").slice(0,2);
    if(!picks.length&&maybes.length&&d.dryUse>=90)picks.push(maybes.find(x=>x.a.id!=="fossils")||maybes[0]);
    picks.forEach(p=>{
      for(const [a,b] of segs){
        let s=a;taken.forEach(([x,y])=>{if(s<y&&s+120>x)s=y+30;});
        const e=Math.min(b,s+150);
        if(e-s>=90){add(s,`${p.a.name}${p.r[0]==="maybe"?" (if it looks OK)":""}`,[s,e]);taken.push([s,e]);break;}
      }
    });
    if(!taken.length&&d.src!=="none")add(10*60,"No good window for outdoor plans today");
    if(d.src==="none"){add(10*60,"Pick from the activities below nearer the time");}
    if(d.wd===1)add(20*60,"Bins out tonight for 7am Tuesday collection");
  }
  P.sort((a,b)=>a[0]-b[0]);
  return {lines:P.map(([m,t])=>[hm(m),t]),windows:W};
}

// ================= Compass and tide chart =================
function compass(d){
  const to=(d.dir+180)%360, col=d.state==="offshore"?"var(--no)":d.state==="cross"?"var(--maybe)":"var(--sea)";
  return `<svg class="compass" viewBox="0 0 100 100" role="img" aria-label="Wind from the ${dirName(d.dir)}, ${d.wind} miles per hour">
    <defs><clipPath id="cc${d.idx}"><circle cx="50" cy="50" r="44"/></clipPath></defs>
    <circle cx="50" cy="50" r="44" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
    <rect x="0" y="58" width="100" height="50" fill="var(--seaFill)" clip-path="url(#cc${d.idx})"/>
    <line x1="6" y1="58" x2="94" y2="58" stroke="var(--sea)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="50" y="16" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Atkinson Hyperlegible,sans-serif">N</text>
    <text x="50" y="52" text-anchor="middle" font-size="8" fill="var(--muted)" font-family="Atkinson Hyperlegible,sans-serif">land</text>
    <text x="50" y="86" text-anchor="middle" font-size="8" fill="var(--sea)" font-family="Atkinson Hyperlegible,sans-serif">sea</text>
    <g transform="rotate(${to} 50 50)"><line x1="50" y1="76" x2="50" y2="30" stroke="${col}" stroke-width="5" stroke-linecap="round"/><path d="M50 20 L60 36 L40 36 Z" fill="${col}"/></g></svg>`;
}
function tideChart(d,windows){
  const td=d.tide,W=360,H=180,L=30,R=346,T=18,B=150;
  const hs=[];for(let m=0;m<=1440;m+=10){const h=tideAt(td,m);if(h!=null)hs.push(h);}
  if(hs.length<100)return null;
  const lo=Math.min(...hs),hi=Math.max(...hs),step=hi-lo>2.4?1:0.5;
  const hMin=Math.floor((lo-0.2)/step)*step,hMax=Math.ceil((hi+0.2)/step)*step;
  const x=m=>L+(R-L)*m/1440,y=h=>B-(B-T)*(h-hMin)/(hMax-hMin);
  const pts=[];for(let m=0;m<=1440;m+=10){const h=tideAt(td,m);if(h!=null)pts.push(`${x(m).toFixed(1)},${y(h).toFixed(1)}`);}
  const [sr,ss]=d.sun;
  let s=`<svg class="tide-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tide curve for ${esc(fmtLong(d.date))}">`;
  s+=`<rect x="${L}" y="${T-8}" width="${x(sr)-L}" height="${B-T+8}" fill="var(--night)"/><rect x="${x(ss)}" y="${T-8}" width="${R-x(ss)}" height="${B-T+8}" fill="var(--night)"/>`;
  // outside the stay
  if(d.first)s+=`<rect x="${L}" y="${T-8}" width="${x(ARRIVE)-L}" height="${B-T+8}" fill="var(--night)"/>`;
  if(d.last)s+=`<rect x="${x(LEAVE)}" y="${T-8}" width="${R-x(LEAVE)}" height="${B-T+8}" fill="var(--night)"/>`;
  windows.forEach(([a,b])=>{s+=`<rect x="${x(a)}" y="${T-8}" width="${x(b)-x(a)}" height="${B-T+8}" fill="var(--buoyFill)" rx="4"/>`;});
  [[sr,"Sunrise"],[ss,"Sunset"]].forEach(([m,lab])=>{const sx=x(m);
    s+=`<line x1="${sx}" x2="${sx}" y1="${T-8}" y2="${B}" stroke="var(--buoy)" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M${sx-6} ${B} a6 6 0 0 1 12 0z" fill="var(--buoy)"/>
    <text x="${sx}" y="${T-11}" text-anchor="middle" font-size="8.5" fill="var(--muted)" font-family="Atkinson Hyperlegible,sans-serif">${lab} ${hm(m)}</text>`;});
  for(let h=hMin+step;h<hMax;h+=step){h=+h.toFixed(2);s+=`<line x1="${L}" x2="${R}" y1="${y(h)}" y2="${y(h)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(h)+3}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="Atkinson Hyperlegible,sans-serif">${h}m</text>`;}
  s+=`<path d="M${x(0)},${B} L${pts.join(" L")} L${x(1440)},${B} Z" fill="var(--seaFill)"/><polyline points="${pts.join(" ")}" fill="none" stroke="var(--sea)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const ex=td.inDay.filter(e=>e.m>=0&&e.m<1440);
  ex.forEach(t=>{const cx=x(t.m),cy=y(t.h),up=t.k==="H";
    s+=`<circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--surface)" stroke="var(--sea)" stroke-width="2"/><text x="${cx}" y="${up||cy+16>B?cy-8:cy+16}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)" font-family="Atkinson Hyperlegible,sans-serif">${hm(t.m)}</text>`;});
  [0,6,12,18,24].forEach(hh=>{s+=`<text x="${x(hh*60)}" y="${B+16}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Atkinson Hyperlegible,sans-serif">${pad(hh%24)}:00</text>`;});
  s+=`</svg>`;
  const list=ex.map(t=>`${t.k==="H"?"High":"Low"} ${hm(t.m)}${td.rel?"":` (${t.h}m)`}`).join(", ");
  return {svg:s,list};
}

// ================= Rendering =================
let DAYS=[];
function stayDates(){
  if(!state.arrive||!state.depart)return null;
  const n=Math.round((parse(state.depart)-parse(state.arrive))/864e5);
  if(n<1)return{error:"Your leaving date needs to be after your arrival date."};
  if(n>21)return{error:"The planner covers stays of up to 21 nights."};
  return{dates:Array.from({length:n+1},(_,i)=>addDays(state.arrive,i)),n};
}
function renderPicks(){
  $("picks").innerHTML=`<label class="tick tick-all"><input type="checkbox" data-all><strong id="allLab">Tick all</strong></label>`+ACTS.map(a=>`<label class="tick"><input type="checkbox" data-tick="${a.id}" ${on(a)?"checked":""}><span class="ic" aria-hidden="true">${ICON[a.ic]}</span>${esc(a.name)}</label>`).join("");

}
function syncAll(){
  const box=document.querySelector("[data-all]");if(!box)return;
  const n=ACTS.filter(on).length;
  box.checked=n===ACTS.length;box.indeterminate=n>0&&n<ACTS.length;
  $("allLab").textContent=n===ACTS.length?"Untick all":"Tick all";
}
$("picks").addEventListener("change",e=>{
  if(e.target.hasAttribute("data-all")){
    const all=ACTS.filter(on).length<ACTS.length;
    state.off=all?[]:ACTS.map(a=>a.id);
    document.querySelectorAll("[data-tick]").forEach(c=>c.checked=all);
  }else{
    const id=e.target.dataset.tick;if(!id)return;
    const off=new Set(state.off||[]);e.target.checked?off.delete(id):off.add(id);state.off=[...off];
  }
  save();syncAll();renderGrid();if(DAYS[state.sel])render(DAYS[state.sel]);});
const tShort=m=>{m=Math.round(m/15)*15;const h=Math.floor(m/60),mm=m%60;return mm?`${h}:${pad(mm)}`:`${h}`;};
function windowFor(a,d,r){
  if(r[0]==="no"||r[0]==="tbc")return null;
  if(a.id==="fossils"&&d.lows.length){const l=d.lows[0].m;return[Math.max(d.useA,l-60),Math.min(d.useB,l+60)];}
  const lo=Math.max(d.useA,d.first?d.useA:9*60);
  const segs=(d.dry||[]).map(([x,y])=>[Math.max(x,lo),Math.min(y,d.useB)]).filter(([x,y])=>y-x>=45);
  if(!segs.length)return d.useB-lo>=45?[lo,Math.min(d.useB,lo+120)]:null;
  const best=segs.sort((p,q)=>(q[1]-q[0])-(p[1]-p[0]))[0];
  return[best[0],Math.min(best[1],best[0]+150)];
}
function renderGrid(){
  const acts=ACTS.filter(on);
  if(!acts.length||!DAYS.length){$("grid").innerHTML=`<tr><td style="cursor:default;background:none;font-weight:400;color:var(--muted)">Tick at least one activity.</td></tr>`;return;}
  const head=`<tr><th class="act-h"></th>${DAYS.map((d,i)=>{const dt=parse(d.date);return`<th data-col="${i}">${d.first?"Arrive":d.last?"Leave":dt.toLocaleDateString("en-GB",{weekday:"short"})}<small>${dt.getDate()} ${dt.toLocaleDateString("en-GB",{month:"short"})}</small></th>`;}).join("")}</tr>`;
  const rows=acts.map(a=>`<tr><th class="act-h" scope="row"><span class="ic" aria-hidden="true">${ICON[a.ic]}</span>${esc(a.name)}</th>${DAYS.map((d,i)=>{
    const r=a.rate(d),w=windowFor(a,d,r);
    const txt=r[0]==="tbc"?"?":w?`${tShort(w[0])}–${tShort(w[1])}`:"–";
    const lab={go:"Go",maybe:"Maybe",no:"No",tbc:"Forecast to come"}[r[0]]||"";
    return`<td class="${r[0]}" data-col="${i}" title="${esc(r[1])}" aria-label="${esc(a.name)}, ${esc(fmtLong(d.date))}: ${lab}${w?", "+hm(w[0])+" to "+hm(w[1]):""}">${txt}</td>`;}).join("")}</tr>`).join("");
  $("grid").innerHTML=head+rows;
}
$("grid").addEventListener("click",e=>{const c=e.target.closest("[data-col]");if(c){select(+c.dataset.col,true);$("strip").scrollIntoView({behavior:"smooth",block:"start"});}});
function renderAll(){
  renderPicks();
  $("arrive").value=state.arrive;$("depart").value=state.depart;$("depart").min=state.arrive;
  const r=stayDates(),err=$("err");
  if(!r||r.error){err.textContent=r?r.error:"Add your dates.";err.hidden=false;$("dates").classList.add("open");$("strip").innerHTML="";$("panel").innerHTML="";return;}
  err.hidden=true;
  DAYS=r.dates.map((s,i)=>buildDay(s,i,r.dates.length));
  const a=parse(state.arrive),dpt=parse(state.depart);
  const f=o=>x=>x.toLocaleDateString("en-GB",o);
  $("stayline").textContent=`${f({weekday:"long",day:"numeric"})(a)}${a.getMonth()!==dpt.getMonth()?" "+f({month:"long"})(a):""} to ${f({weekday:"long",day:"numeric",month:"long"})(dpt)}, ${r.n} night${r.n>1?"s":""}`;
  const strip=$("strip");strip.innerHTML="";
  DAYS.forEach((d,idx)=>{
    const b=document.createElement("button");b.className="day-btn";b.setAttribute("role","tab");
    const dt=parse(d.date);
    const ic=d.src==="none"?(d.first?"key":d.last?"bag":"dot"):ICON[WXICON[d.wx]]?WXICON[d.wx]:"dot";
    b.innerHTML=`<span class="dn">${d.first?"Arrive":d.last?"Leave":dt.toLocaleDateString("en-GB",{weekday:"short"})}</span><span class="de" aria-hidden="true">${ICON[ic]}</span><span class="dd">${dt.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span>`;
    b.setAttribute("aria-label",fmtLong(d.date));
    b.addEventListener("click",()=>select(idx,true));
    b.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();select(Math.min(idx+1,DAYS.length-1),true,true);}if(e.key==="ArrowLeft"){e.preventDefault();select(Math.max(idx-1,0),true,true);}});
    strip.appendChild(b);
  });
  renderFooter();renderGrid();
  let start=DAYS.findIndex(d=>d.date===iso(new Date()));

function render(d){
  const A=analyse(d),panel=$("panel");

  let conds="";

    const noteStyle=d.state==="offshore"||d.gust>=40?"background:var(--noBg);color:var(--no)":d.state==="cross"?"background:var(--maybeBg);color:var(--maybe)":"background:var(--seaFill);color:var(--ink)";
    const note=d.gust>=40?`Gales: gusts up to ${d.gust}mph. Keep well back from the waterline.`:d.state==="offshore"?"Offshore: the wind blows out to sea here. Keep inflatables and boards out of the water.":d.state==="cross"?"Blowing along the beach. Fine on land; paddlers stay close in.":"Onshore: blowing in from the sea, the safe direction for the beach.";
    conds=`<section class="conds" aria-label="Conditions">${compass(d)}<div class="cond-list">
      <div><b>${dirName(d.dir)} ${d.wind}mph</b><span>Gusts ${d.gust}mph</span></div>
      <div><b>${d.t}°C</b><span>${esc(d.sky)}</span></div>
      <div><b>${d.dryUse>=d.useB-d.useA-30?"Dry":d.dryUse<60?"Wet":"Mixed"}</b><span>${d.dryUse>=d.useB-d.useA-30?"No rain in daylight":d.dryUse<60?"Rain most of the day":"Driest "+dryText(d)}</span></div>
      <div><b>${d.waves!=null?d.waves.toFixed(1)+"m":"–"}</b><span>Waves${d.sea!=null?`, sea ${Math.round(d.sea)}°C`:""}</span></div>
      <div><b>${hm(d.sun[0])}</b><span>Sunrise</span></div>
      <div><b>${hm(d.sun[1])}</b><span>Sunset</span></div>

  }else{
    conds=`<section class="conds" aria-label="Daylight"><div class="cond-list" style="grid-column:1/-1">

  const tc=d.tide?tideChart(d,A.plan.windows):null;
  const tide=tc?`<section class="tide"><h3>Tides and best windows</h3>${tc.svg}

    <p class="small">${tc.list}.${d.tide.rel?" Times are modelled; check an official tide table before going in the sea.":""}</p></section>`:"";
  const order={go:0,maybe:1,any:2,tbc:3,no:4};
  const label={go:"Go",maybe:"Maybe",no:"No",any:"Any time",tbc:"Check later"};
  const acts=A.rated.slice().sort((x,y)=>order[x.r[0]]-order[y.r[0]]).map(({a,r})=>`
    <div class="act"><span class="ic" aria-hidden="true">${ICON[a.ic]}</span><span class="nm">${esc(a.name)}</span><span class="pill ${r[0]}">${label[r[0]]}</span>
    <span class="why">${esc(r[1])}${a.link&&r[0]!=="no"?` <a href="${a.link[1]}" target="_blank" rel="noopener">${esc(a.link[0])}</a>`:""}</span></div>`).join("");
  panel.innerHTML=`<figure class="hero">${scene(d,A.best.map(x=>x.a.id))}</figure>
    <section class="verdict">${A.kind?`<p class="kind">${A.kind}</p>`:""}<h2>${esc(A.title)}</h2><p>${esc(A.summary)}</p><span class="conf">${conf}</span></section>
    ${conds}${tide}
    <section class="plan"><h3>Suggested plan</h3><ol>${A.plan.lines.map(p=>`<li><time>${p[0]}</time><span>${esc(p[1])}</span></li>`).join("")}</ol></section>

    <section class="acts"><h3>Activities</h3>${acts}</section>`;
  $("share").onclick=share;$("print").onclick=()=>window.print();
}
const SLOTS=[["morning","Morning"],["afternoon","Afternoon"],["evening","Evening"]];
function slotOpen(d,s){return d.first?s==="evening":d.last?s==="morning":true;}
function mine(d){
  return SLOTS.map(([s,n])=>{
    if(!slotOpen(d,s))return`<div class="slot off"><div class="slot-name">${n}</div><div class="offtxt">${d.first?"You arrive after 16:00":"You’ll have checked out"}</div></div>`;
    const list=(state.plan[d.date]&&state.plan[d.date][s])||[];
    const items=list.map((e,i)=>{const a=e.id?ACT(e.id):null;const nm=a?a.name:e.own;if(!nm)return"";
      return`<div class="item"><strong>${esc(nm)}</strong>${a&&a.link?`<a href="${a.link[1]}" target="_blank" rel="noopener">${esc(a.link[0])}</a>`:""}<button class="rm" data-rm="${d.date}|${s}|${i}" aria-label="Remove ${esc(nm)}">×</button></div>`;}).join("");
    return`<div class="slot"><div class="slot-name">${n}</div><div class="items">${items}<button class="add" data-add="${d.date}|${s}">Add${list.length?" another":""}</button></div></div>`;
  }).join("");
}
function select(idx,user,focus){

  const btn=strip.children[idx];if(!btn)return;
  if(focus)btn.focus();
  btn.scrollIntoView({inline:"center",block:"nearest",behavior:user?"smooth":"auto"});
  const panel=$("panel");panel.classList.add("fading");
  setTimeout(()=>{render(DAYS[idx]);panel.classList.remove("fading");},user?120:0);
  state.sel=idx;save();
}
function renderRules(){
  const R=[
    "When the wind blows from the north or east it’s offshore here: keep paddleboards, bodyboards, kites and inflatables out of the open sea.",
    "Stay well away from the harbour mouth by East Head, where currents run hard as the tide drops."
  ];
  if(DAYS.some(d=>d.wd===1&&!d.last))R.push("Bins go out on Monday evening for collection from 7am Tuesday. Recycling and general waste alternate: check the dates above the bin.");
  for(let i=0;i<DAYS.length-1;i++){const a=ukOffset(DAYS[i].date),b=ukOffset(DAYS[i+1].date);if(a!==b)R.push(`Clocks go ${b<a?"back":"forward"} an hour early on ${fmtLong(DAYS[i+1].date)}.`);}
  R.push("Leaving: keys back in the keybox, don’t bolt the back gate, and log out of your own streaming accounts on the TV.");
  $("rules").innerHTML=R.map(t=>`<li>${esc(t)}</li>`).join("");
}
function renderFooter(){
  const live=DAYS.some(d=>d.src==="live"),snap=DAYS.some(d=>d.src==="snap");
  $("footer").innerHTML=`<p>${live?`Weather, waves and tides from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (data from DWD and other national weather services). Tide times are modelled and approximate on this coast.`:snap?`Forecast saved on ${SNAP_TAKEN} from the Met Office beach forecast, Surf-Forecast and Wisuki tides. Open this guide from its web link for the live forecast.`:"The live forecast loads when you’re online, about ten days ahead."} Always check conditions on the beach before going in the water. Your dates and plans are saved on this device only.</p>`;
}

// ================= Sheet =================
let target=null;
function openSheet(date,slot){
  target={date,slot};const d=DAYS.find(x=>x.date===date);
  $("sheetT").textContent=`${SLOTS.find(s=>s[0]===slot)[1]}, ${parse(date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}`;
  const order={go:0,any:1,maybe:2,tbc:3,no:4};
  const list=ACTS.filter(on).map(a=>({a,r:a.rate(d)})).sort((x,y)=>order[x.r[0]]-order[y.r[0]]);
  const label={go:"Go",maybe:"Maybe",no:"No",any:"Any time",tbc:"Check later"};
  $("ideas").innerHTML=list.map(({a,r})=>`<li class="idea"><button data-pick="${a.id}" ${r[0]==="no"?"disabled":""}><span class="ic" aria-hidden="true">${ICON[a.ic]}</span><span class="nm">${esc(a.name)}</span><span class="pill ${r[0]}">${label[r[0]]}</span><span class="why">${esc(r[1])}</span></button></li>`).join("");
  $("ownTxt").value="";$("sheet").showModal();
}
function addEntry(e){const {date,slot}=target;state.plan[date]=state.plan[date]||{};(state.plan[date][slot]=state.plan[date][slot]||[]).push(e);save();$("sheet").close();render(DAYS[state.sel]);}
async function share(){
  const lines=["Our stay at Moonfleet",""];
  DAYS.forEach(d=>{const p=state.plan[d.date]||{};const rows=SLOTS.flatMap(([s,n])=>(p[s]||[]).filter(e=>e.own||ACT(e.id)).map(e=>`  ${n}: ${e.id?(ACT(e.id)||{}).name:e.own}`));
    lines.push(fmtLong(d.date)+(d.first?" (arrive from 16:00)":d.last?" (check out by 10:00)":""),...(rows.length?rows:["  Nothing planned yet"]),"");});
  const text=lines.join("\n").trim(),t=$("toast");
  if(navigator.share){try{await navigator.share({title:"Our stay at Moonfleet",text});return;}catch(err){if(err.name==="AbortError")return;}}
  try{await navigator.clipboard.writeText(text);t.textContent="Plan copied. Paste it into a message to share it.";}catch(err){t.textContent="Couldn’t copy automatically. Use Print instead.";}
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-add]");if(a){const [d,s]=a.dataset.add.split("|");openSheet(d,s);return;}
  const r=e.target.closest("[data-rm]");if(r){const [d,s,i]=r.dataset.rm.split("|");state.plan[d][s].splice(+i,1);save();render(DAYS[state.sel]);return;}
  const p=e.target.closest("[data-pick]");if(p){addEntry({id:p.dataset.pick});}
});
$("close").onclick=()=>$("sheet").close();
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))$("sheet").close();});
$("own").addEventListener("submit",e=>{e.preventDefault();const v=$("ownTxt").value.trim();if(v)addEntry({own:v});});
$("edit").onclick=()=>{const o=$("dates").classList.toggle("open");$("edit").setAttribute("aria-expanded",o);};
$("arrive").addEventListener("change",e=>{state.arrive=e.target.value;if(state.arrive&&(!state.depart||state.depart<=state.arrive))state.depart=addDays(state.arrive,3);state.sel=0;save();renderAll();});
$("depart").addEventListener("change",e=>{state.depart=e.target.value;save();renderAll();});

renderAll();
loadLive().then(()=>{if(LIVE)renderAll();});
</script>
</body>
</html>
